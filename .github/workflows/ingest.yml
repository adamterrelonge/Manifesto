# Daily ingest + free local semantic tagging + source health check.
#
# Why GitHub Actions and not Vercel Cron: a full run (90+ sources + the
# expiry/dedup/classify/quality/prune/notify pipeline, then semantic
# tagging) takes ~15-20 minutes, and the semantic classifier needs a ~35MB
# model and CPU inference — neither fits a serverless function. See
# scripts/ingest.ts.
#
# Alerting: the "Source health" step fails the job when a scraper breaks
# (see lib/source-health.ts), so GitHub's failed-run email is the alert.
# Its report is on the run's Summary page either way.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   SKIDDLE_API_KEY, TICKETMASTER_API_KEY, EVENTBRITE_API_TOKEN
# Optional: RESEND_API_KEY / RESEND_FROM_EMAIL (notification digests are only
#   emailed when set — setting them here turns on real user emails).

name: Ingest

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      # Scrapers build dates from venue-local wall-clock text ("7:00pm") via
      # new Date(y, m, d) / setHours, which use the process timezone. The
      # runner defaults to UTC, which would shift every scraped time by an
      # hour during BST; match the local dev machine instead.
      TZ: Europe/London
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SKIDDLE_API_KEY: ${{ secrets.SKIDDLE_API_KEY }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      EVENTBRITE_API_TOKEN: ${{ secrets.EVENTBRITE_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --include=dev: NODE_ENV=production (job env) makes npm skip
      # devDependencies, but the scripts need tsx and @huggingface/transformers.
      - name: Install dependencies
        id: install
        run: npm ci --include=dev

      # .cache holds the embedding cache + downloaded model (so each run only
      # embeds new or changed events) and the source-health history. Restore
      # and save are separate steps so the save still runs when the health
      # check fails the job — actions/cache's combined form only saves on
      # success, which would drop that run from the history.
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: classifier-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: classifier-cache-

      - name: Ingest all sources and run the pipeline
        run: npm run ingest

      - name: Suggest bucket tags (review queue only, never public)
        run: npm run classify:semantic -- --write

      # Local zero-shot model (lib/zero-shot.ts): writes tags only for
      # buckets that passed the precision bar in docs/MODEL_EVAL.md, each
      # with a verbatim evidence passage. After the step above so it can
      # upgrade a pending embedding suggestion it finds evidence for.
      # Needs migration 0021. Shown counts include these from the next run.
      - name: Model tags with evidence (eval-gated buckets only)
        run: npm run classify:model -- --write

      # Runs even when ingest/classify fail (that's when the report matters),
      # but not when install failed — then tsx doesn't exist and the step
      # would only add a misleading "tsx: not found" on top of the real error.
      - name: Source health
        if: always() && steps.install.outcome == 'success'
        run: npm run health

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: classifier-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-result
          path: |
            .cache/ingest-latest.json
            .cache/source-history.json
          if-no-files-found: ignore
          retention-days: 14
